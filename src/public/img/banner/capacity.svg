<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" width="820" height="190" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <filter id="capRough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="capWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFF4F0"/>
      <stop offset="0.55" stop-color="#F5F1E7"/>
      <stop offset="1" stop-color="#EADCC2"/>
    </linearGradient>
  </defs>

  <rect width="820" height="190" fill="url(#capWash)"/>

  <g filter="url(#capRough)" fill="none" stroke-linecap="round">
    <ellipse cx="660" cy="95" rx="230" ry="120" stroke="#BE9552" stroke-width="3.5" opacity="0.6"/>
    <ellipse cx="660" cy="95" rx="186" ry="96" stroke="#BE9552" stroke-width="3.5" opacity="0.65"/>
    <ellipse cx="662" cy="95" rx="142" ry="74" stroke="#4FB096" stroke-width="3.5" opacity="0.7"/>
    <ellipse cx="664" cy="95" rx="98" ry="52" stroke="#4FB096" stroke-width="3.5" opacity="0.78"/>
    <ellipse cx="666" cy="95" rx="56" ry="30" stroke="#EE8E6E" stroke-width="4" opacity="0.9"/>
  </g>

  <circle cx="666" cy="95" r="11" fill="#EE8E6E" opacity="0.8"/>
  <circle cx="790" cy="30" r="7" fill="#6FC7AE" opacity="0.8"/>
</svg>
